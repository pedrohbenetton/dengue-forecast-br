name: Deploy GitHub Pages

# Publica o site a cada push na main. O histórico do backtest vem de site/history.tar.gz
# (gerado localmente por `dengue_forecast.export`); a previsão ao vivo é reaproveitada do
# site já publicado, e só é recalculada pelo workflow semanal (weekly.yml).

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      live_artifact:
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dados do histórico
        run: mkdir -p web/public/data && tar xzf site/history.tar.gz -C web/public/data
      - name: Previsão ao vivo (do workflow semanal)
        if: inputs.live_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.live_artifact }}
          path: web/public/data
      - name: Previsão ao vivo (reaproveitada do site publicado)
        if: inputs.live_artifact == ''
        run: |
          url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/data/live.json"
          if curl -fsSL "$url" -o /tmp/live.json; then
            mv /tmp/live.json web/public/data/live.json
          else
            echo "mantendo live.json empacotado em site/history.tar.gz"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd web && npm ci && npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/dist
          force_orphan: true  # o branch gh-pages não acumula histórico de dados
